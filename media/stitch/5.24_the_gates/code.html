<script>
        const carousel = document.getElementById('onboarding-carousel');
        const dots = [
            document.getElementById('dot-0'),
            document.getElementById('dot-1'),
            document.getElementById('dot-2')
        ];

        // Function to scroll to the next panel
        function nextPanel(currentIndex) {
            const width = carousel.offsetWidth;
            carousel.scrollTo({
                left: width * currentIndex,
                behavior: 'smooth'
            });
        }

        // Update dots based on scroll position
        carousel.addEventListener('scroll', () => {
            const width = carousel.offsetWidth;
            const scrollLeft = carousel.scrollLeft;
            
            // Calculate active index with a slight threshold
            const activeIndex = Math.round(scrollLeft / width);

            // Update dot styling
            dots.forEach((dot, index) => {
                if (index === activeIndex) {
                    dot.classList.remove('bg-outline-variant');
                    dot.classList.add('bg-primary');
                    // Add slight scale to active dot
                    dot.style.transform = 'scale(1.2)';
                } else {
                    dot.classList.remove('bg-primary');
                    dot.classList.add('bg-outline-variant');
                    dot.style.transform = 'scale(1)';
                }
            });
        });
    </script>
