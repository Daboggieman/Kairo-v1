<style>
        /* Meander (Greek Key) Pattern for borders */
        .meander-border-bottom {
            position: relative;
        }
        .meander-border-bottom::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background-image: url("data:image/svg+xml,%3Csvg width='24' height='4' viewBox='0 0 24 4' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0H24V4H0V0ZM4 0H8V2H4V0ZM12 0H16V2H12V0ZM20 0H24V2H20V0Z' fill='%23D79E2D' fill-opacity='0.5'/%3E%3C/svg%3E");
            background-repeat: repeat-x;
        }
        
        /* Custom toggle switch styling to match Spartan aesthetic */
        .spartan-toggle {
            appearance: none;
            width: 48px;
            height: 24px;
            background-color: transparent;
            border: 1px solid #9c8f7c; /* outline */
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease-in-out;
        }
        .spartan-toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background-color: #9c8f7c;
            transition: all 0.2s ease-in-out;
        }
        .spartan-toggle:checked {
            border-color: #D79E2D; /* primary-container */
        }
        .spartan-toggle:checked::after {
            transform: translateX(24px);
            background-color: #D79E2D;
        }
    </style>
