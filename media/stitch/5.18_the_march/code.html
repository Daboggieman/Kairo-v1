<!DOCTYPE html>

<style>
        /* Tactical Brutalist Meander/Key */
        .meander-border-bottom {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='4' viewBox='0 0 40 4' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 4V0H8V2H4V4H0ZM12 4V0H20V4H16V2H12V4ZM24 4V0H32V4H28V2H24V4ZM36 4V0H40V2H38V4H36Z' fill='%23504535'/%3E%3C/svg%3E");
            background-repeat: repeat-x;
            background-position: bottom;
            padding-bottom: 4px;
        }
        
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>

<body class="bg-background text-on-surface h-screen flex flex-col font-body-md overflow-hidden antialiased">
<!-- Top App Bar -->
<header class="bg-surface border-b-4 border-primary flex justify-between items-center px-container-padding h-16 shrink-0 z-50">
<button class="text-primary hover:opacity-80 transition-opacity duration-200 focus:outline-none">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0;">arrow_back_ios</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary tracking-widest text-center flex-1 mx-4">THE MARCH</h1>
<div class="text-primary font-label-md text-label-md tabular-nums tracking-wider w-16 text-right">
            28:04
        </div>
</header>
<!-- Map Area (Upper 55%) -->
<div class="relative h-[55vh] w-full shrink-0">
<!-- Mock Map Background using DataStore Placeholder and data-location -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A dark, tactical topographical map of a rugged landscape. Landmasses are rendered in very dark grey (#0B0D10), roads in slightly lighter grey (#1D2128), and bodies of water in dark navy blue (#12233A). The map is highly detailed with contour lines and a military or satellite-grade aesthetic. Lighting is flat, emphasizing the brutalist, high-contrast structural data." data-location="Sparta" style="background-image: url('https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg')"></div>
<!-- Polyline & Position Indicator Mock -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none" viewbox="0 0 100 100">
<!-- Route Polyline (Gold) -->
<path d="M 20 80 L 40 60 L 50 70 L 70 30 L 60 20" fill="none" stroke="#D79E2D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
<!-- Cone/Heading -->
<polygon fill="rgba(215, 158, 45, 0.4)" points="60,20 57,28 63,28"></polygon>
<!-- Position Dot -->
<circle cx="60" cy="20" fill="#D79E2D" r="2.5" stroke="#101418" stroke-width="0.5"></circle>
</svg>
<!-- Top Left Pill (DROMOS Status) -->
<div class="absolute top-4 left-4 bg-surface border border-outline-variant rounded-full px-3 py-1.5 flex items-center space-x-2 shadow-lg">
<div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
<span class="font-label-sm text-label-sm text-primary-container tracking-widest uppercase">DROMOS</span>
</div>
<!-- Bottom Right Recenter Button -->
<button class="absolute bottom-4 right-4 w-11 h-11 bg-surface border border-outline-variant rounded shadow-lg flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">my_location</span>
</button>
</div>
<!-- Stats & Controls Area -->
<main class="flex-1 flex flex-col bg-surface-container-lowest z-10 border-t border-outline-variant relative">
<!-- Hero Readout -->
<div class="py-6 flex flex-col items-center justify-center border-b border-outline-variant">
<div class="flex items-baseline justify-center space-x-2">
<span class="text-[56px] leading-none font-bold text-primary-container font-display-lg tabular-nums tracking-tighter">4.812</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">KM</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mt-2">TOTAL DISTANCE</span>
</div>
<!-- Stat Row -->
<div class="flex border-b border-outline-variant divide-x divide-outline-variant flex-1 min-h-[80px]">
<!-- Moving -->
<div class="flex-1 flex flex-col items-center justify-center p-2">
<span class="font-headline-sm text-headline-sm text-on-surface tabular-nums">28:04</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1 uppercase tracking-wider">MOVING</span>
</div>
<!-- Elapsed -->
<div class="flex-1 flex flex-col items-center justify-center p-2">
<span class="font-headline-sm text-headline-sm text-on-surface tabular-nums">29:41</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1 uppercase tracking-wider">ELAPSED</span>
</div>
<!-- Pace -->
<div class="flex-1 flex flex-col items-center justify-center p-2">
<span class="font-headline-sm text-headline-sm text-on-surface tabular-nums">5:00</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1 uppercase tracking-wider">PACE /KM</span>
</div>
</div>
<!-- Bottom Controls -->
<div class="flex-1 flex items-center justify-between px-container-padding py-6 min-h-[140px] bg-surface relative">
<!-- Hint Text -->
<div class="absolute left-1/2 -translate-x-1/2 bottom-3 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest opacity-50 text-center w-full">
                Hold to finish
            </div>
<!-- Pause Button -->
<button class="w-[72px] h-[72px] rounded-full bg-transparent border-2 border-outline-variant flex flex-col items-center justify-center text-on-surface-variant hover:text-primary hover:border-primary transition-all active:scale-95 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
<span class="material-symbols-outlined text-3xl group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">pause</span>
<span class="font-label-sm text-[10px] mt-1 uppercase tracking-wider hidden group-hover:block transition-all">Pause</span>
</button>
<!-- Finish Button -->
<button class="w-[72px] h-[72px] rounded-full bg-transparent border-2 border-error text-error flex flex-col items-center justify-center hover:bg-error/10 transition-all active:scale-95 group focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-surface">
<span class="material-symbols-outlined text-3xl group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 0;">flag</span>
<span class="font-label-sm text-[10px] mt-1 uppercase tracking-wider hidden group-hover:block transition-all">Finish</span>
</button>
</div>
</main>
</body></html>
