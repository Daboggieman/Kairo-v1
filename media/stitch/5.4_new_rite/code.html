</div>

<div class="flex flex-col gap-4">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">CADENCE</label>

<button class="h-14 rounded-lg bg-surface-container border border-outline-variant text-on-surface font-label-md text-label-md hover:bg-surface-container-highest transition-colors flex items-center justify-center">Every day</button>
